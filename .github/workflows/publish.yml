name: Quarto Publish

on:
  push:
    branches:
      - main # Triggers the action when you push to main

permissions:
  contents: write # REQUIRED: Allows the action to commit new files to the gh-pages branch
  pages: write    # REQUIRED: Allows the action to update GitHub Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages # This tells Quarto to commit the output to the gh-pages branch
          path: core       # Tells Quarto your source files are in the core/ folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}