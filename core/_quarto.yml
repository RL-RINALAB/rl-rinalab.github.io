# USE THIS FILE TO EDIT YOUR QUARTO CONFIGURATION. A LOT OF FEATURES ARE RELVATIVELY SELF-EVIDENT IN THERE> 
project:
  type: website
  output-dir: public
  resources:
    - "CNAME"
    - robots.txt

execute:
  freeze: auto

website:
  title: "RHINELABLOGIT, Webside Template W3"
  site-url: https://rl-rinalab.github.io
  repo-url: https://github.com/RL-RINALAB/rl-rinalab.github.io
  repo-actions: [edit, issue, source]
  
  search:
    location: sidebar
    type: textbox
    limit: 30
    collapse-after: 3
    show-item-context: tree
    copy-button: true

  navbar:
    right:
      - href: index.qmd
        text: Central
      #- href: about.qmd
      #  text: Information
      #- href: contents/updates/post.qmd
      #  text: Research and Updates

  sidebar:
    style: floating
    pinned: true
    collapse-level: 2
    border: true
    search: true
    tools:
      - icon: house
        href: https://amane-fujimiya.github.io/
        text: RHINELAB
    contents:
      - index.qmd
      - contents/example.qmd
      # SEE MORE ABOUT THESE CONTEXT AND SPECIFICATION IN QUARTO'S OWN DOCUMENTATION, OR THE LAB's ONE. THE FOLLOWING IS SOME EXAMPLE TAKEN FROM MTAIL. 
